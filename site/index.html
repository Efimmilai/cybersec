<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python для кибербезопасности PRO</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #07111f; color: #e5edf8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: linear-gradient(rgba(34,211,238,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(139,92,246,.06) 1px, transparent 1px), radial-gradient(circle at 8% 0%, rgba(34,211,238,.18), transparent 30rem), radial-gradient(circle at 96% 12%, rgba(139,92,246,.16), transparent 34rem), #07111f; background-size: 42px 42px, 42px 42px, auto, auto, auto; }
      button, textarea { font: inherit; } button { cursor: pointer; }
      .shell { max-width: 1180px; margin: 0 auto; padding: 24px 18px 56px; }
      .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: -24px -18px 24px; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,.1); background: rgba(7,17,31,.86); backdrop-filter: blur(14px); }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 850; }
      .mark { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: #67e8f9; color: #06111f; font-weight: 900; }
      .nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
      .nav button, .button, .ghost { min-height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); padding: 9px 13px; color: #e5edf8; background: rgba(255,255,255,.05); }
      .nav button.active, .button { border-color: transparent; background: #67e8f9; color: #06111f; font-weight: 800; }
      .ghost:hover, .nav button:hover { border-color: rgba(34,211,238,.35); color: #ecfeff; } .button:hover { background: #a5f3fc; }
      .hero, .card { border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: rgba(13,24,40,.8); box-shadow: 0 18px 55px rgba(0,0,0,.24); backdrop-filter: blur(14px); }
      .hero { padding: 28px; background: linear-gradient(135deg, rgba(34,211,238,.16), rgba(13,24,40,.88) 48%, rgba(139,92,246,.16)); }
      .card { padding: 20px; }
      .eyebrow, .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(34,211,238,.3); background: rgba(34,211,238,.09); color: #c8fbff; border-radius: 999px; }
      .eyebrow { padding: 6px 10px; font-size: 14px; } .pill { padding: 5px 9px; font-size: 12px; margin: 8px 8px 0 0; }
      h1 { margin: 18px 0 10px; font-size: clamp(30px, 5vw, 58px); line-height: 1.03; letter-spacing: 0; } h2 { margin: 0 0 12px; font-size: 24px; } h3 { margin: 0; font-size: 18px; }
      p, li { color: #b7c5d8; line-height: 1.65; } .muted { color: #8ea1ba; }
      .grid { display: grid; gap: 16px; } .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 18px 0 28px; } .modules { grid-template-columns: repeat(2, minmax(0, 1fr)); } .projects { grid-template-columns: repeat(3, minmax(0, 1fr)); } .two { grid-template-columns: 1.1fr .9fr; }
      .stat { font-size: 30px; font-weight: 850; color: white; } .section { margin-top: 28px; }
      .bar { height: 8px; border-radius: 999px; background: #162337; overflow: hidden; margin-top: 14px; } .fill { height: 100%; width: var(--value); background: linear-gradient(90deg, #22d3ee, #8b5cf6); }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; background: rgba(255,255,255,.035); padding: 12px; } .row + .row { margin-top: 10px; }
      .notice { border: 1px solid rgba(251,191,36,.28); background: rgba(251,191,36,.09); color: #fde68a; border-radius: 8px; padding: 12px; }
      textarea { width: 100%; min-height: 220px; border-radius: 8px; border: 1px solid rgba(34,211,238,.22); background: rgba(2,6,23,.86); color: #bae6fd; padding: 14px; font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; outline: none; }
      textarea:focus { border-color: rgba(34,211,238,.65); }
      .answer { width: 100%; text-align: left; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: rgba(255,255,255,.04); color: #d7e2f0; padding: 11px 12px; margin-top: 8px; }
      .answer.selected { border-color: rgba(34,211,238,.55); background: rgba(34,211,238,.12); color: white; }
      .result { min-height: 26px; font-weight: 750; } .success { color: #bbf7d0; } .warn { color: #fde68a; } .hidden { display: none; }
      @media (max-width: 900px) { .stats, .modules, .projects, .two { grid-template-columns: 1fr; } .hero { padding: 22px; } .topbar { align-items: flex-start; flex-direction: column; } .nav { justify-content: flex-start; } }
    </style>
  </head>
  <body>
    <main class="shell"><header class="topbar"><div class="brand"><span class="mark">Py</span><span>Cyber Python PRO</span></div><nav class="nav"><button id="nav-dashboard" onclick="showDashboard()">Дашборд</button><button id="nav-modules" onclick="showModules()">Модули</button><button id="nav-projects" onclick="showProjects()">Проекты</button><button id="nav-final" onclick="showFinal()">Капстоун</button></nav></header><div id="app"></div></main>
    <script>
      const course = [
        { title: "Подготовка окружения", level: "Старт", time: "3 часа", project: "Шаблон security-tools", lessons: ["Python, VS Code, Git и виртуальное окружение", "Структура production-проекта", "Работа с зависимостями: pip, uv, pyproject.toml"] },
        { title: "Основы Python для ИБ", level: "База", time: "6 часов", project: "Password Strength Checker", lessons: ["Переменные, типы данных и условия", "Циклы и функции", "Списки, словари, множества", "Обработка ошибок", "CLI-аргументы"] },
        { title: "Строки, Regex и IOC", level: "База", time: "7 часов", project: "IOC Parser", lessons: ["Работа со строками", "Регулярные выражения", "IPv4, IPv6, URL, Email, Domain, MAC", "Hash: MD5, SHA1, SHA256", "Нормализация и дедупликация IOC"] },
        { title: "Файлы и форматы данных", level: "База", time: "6 часов", project: "Directory Scanner", lessons: ["pathlib и работа с файлами", "CSV", "JSON", "XML и YAML", "ZIP и архивы"] },
        { title: "Анализ логов", level: "Средний", time: "7 часов", project: "Log Analyzer", lessons: ["Что такое лог и событие безопасности", "Windows Event Logs", "Linux Syslog", "Nginx / Apache / IIS logs", "Поиск аномалий и подозрительных паттернов"] },
        { title: "Сетевое программирование", level: "Средний", time: "8 часов", project: "Banner Grabber / Port Scanner", safe: "Сканирование только localhost или явно разрешенных лабораторных целей.", lessons: ["TCP / UDP basics", "socket в Python", "Banner grabbing", "Port scanning", "Таймауты, ошибки и ограничения"] },
        { title: "API и Threat Intelligence", level: "Средний", time: "7 часов", project: "Threat Intelligence Client", lessons: ["REST API", "requests и httpx", "API keys and secrets handling", "Mock VirusTotal / AbuseIPDB / Shodan clients", "Rate limits and error handling"] },
        { title: "PCAP и сетевой анализ", level: "Средний", time: "6 часов", project: "PCAP Analyzer", lessons: ["What is PCAP", "Scapy / PyShark overview", "DNS traffic analysis", "HTTP traffic analysis", "Suspicious communication patterns"] },
        { title: "Криптография и пароли", level: "Средний", time: "7 часов", project: "Password Auditor", safe: "Фокус на defensive audit и безопасном хранении, без атак на реальные системы.", lessons: ["Hash functions", "Salt", "bcrypt", "Argon2", "AES / RSA / ECC overview"] },
        { title: "Secure Coding на Python", level: "Средний", time: "7 часов", project: "Исправление уязвимых сниппетов", lessons: ["OWASP Top 10 overview", "SQL Injection", "Command Injection", "Path Traversal", "Secrets in code", "Input validation"] },
        { title: "FastAPI для Security Tools", level: "Продвинутый", time: "8 часов", project: "IOC Search API", lessons: ["FastAPI basics", "Pydantic schemas", "REST endpoints", "Error handling", "Auth basics"] },
        { title: "PostgreSQL и хранение данных", level: "Продвинутый", time: "7 часов", project: "IOC API + PostgreSQL", lessons: ["Relational data model", "SQLAlchemy", "Alembic migrations", "Storing IOC and scan results", "Querying history"] },
        { title: "Docker и запуск проекта", level: "Продвинутый", time: "6 часов", project: "Containerized IOC API", lessons: ["Dockerfile", "Docker Compose", "Volumes", "Networks", "Environment variables"] },
        { title: "Асинхронность", level: "Продвинутый", time: "7 часов", project: "Async checker", lessons: ["asyncio", "aiohttp / httpx async", "concurrent checks", "rate limiting", "safe retries"] },
        { title: "DevSecOps", level: "Продвинутый", time: "6 часов", project: "CI/CD pipeline", lessons: ["GitHub Actions", "Bandit", "Semgrep", "Trivy", "Dependency scanning"] },
        { title: "AI для кибербезопасности", level: "Продвинутый", time: "6 часов", project: "AI Log Analyzer", lessons: ["LLM use cases in cybersecurity", "Log summarization", "Report generation", "Prompt safety", "Human-in-the-loop review"] },
        { title: "Infrastructure Audit Automation", level: "Продвинутый", time: "8 часов", project: "Config Compliance Checker", lessons: ["Network device configuration audit", "Huawei / Cisco config parsing", "ACL checks", "SSH / Telnet / SNMP checks", "Compliance rules engine"] },
        { title: "Final Capstone", level: "Проект", time: "10 часов", project: "Security Inspector", lessons: ["Security Inspector architecture", "Backend design", "Frontend dashboard", "Report generation", "Deployment plan"] }
      ];
      const projects = ["Password Strength Checker", "IOC Parser", "Directory Scanner", "Log Analyzer", "Port Scanner", "Banner Grabber", "Threat Intelligence Client", "PCAP Analyzer", "Password Auditor", "IOC Search API", "Security Dashboard", "Security Inspector"];
      const app = document.getElementById("app");
      const progress = JSON.parse(localStorage.getItem("cyberCourseProgress") || '{"lessons":[],"quiz":[],"code":[],"projects":[]}');
      let currentModule = 0, currentLesson = 0, selectedAnswer = "";
      const lessonId = (m, l) => `m${m}-l${l}`;
      const totalLessons = () => course.reduce((sum, module) => sum + module.lessons.length, 0);
      const allDoneCount = () => progress.lessons.length + progress.quiz.length + progress.code.length + progress.projects.length;
      const allTrackable = () => totalLessons() * 3 + projects.length;
      const save = () => localStorage.setItem("cyberCourseProgress", JSON.stringify(progress));
      const addUnique = (bucket, id) => { if (!progress[bucket].includes(id)) progress[bucket].push(id); save(); };
      const moduleProgress = m => Math.round(course[m].lessons.filter((_, l) => progress.lessons.includes(lessonId(m, l))).length / course[m].lessons.length * 100);
      const setNav = name => ["dashboard", "modules", "projects", "final"].forEach(item => document.getElementById(`nav-${item}`).classList.toggle("active", item === name));
      const scrollTop = () => window.scrollTo({ top: 0, behavior: "smooth" });
      function showDashboard() { setNav("dashboard"); const r = findRecommended(); app.innerHTML = `<section class="hero"><span class="eyebrow">Interactive Cybersecurity Course</span><h1>Python для кибербезопасности PRO</h1><p>Рабочий курс с модулями, уроками, квизами, тренажерами кода и прогрессом в localStorage.</p><button class="button" onclick="openLesson(${r.m}, ${r.l})">Продолжить обучение</button></section><section class="grid stats"><div class="card"><div class="stat">${Math.round(allDoneCount() / allTrackable() * 100)}%</div><p>Общий прогресс</p></div><div class="card"><div class="stat">${progress.lessons.length}/${totalLessons()}</div><p>Уроки</p></div><div class="card"><div class="stat">${progress.quiz.length}/${totalLessons()}</div><p>Квизы</p></div><div class="card"><div class="stat">${progress.projects.length}/${projects.length}</div><p>Проекты</p></div></section><section class="section"><h2>Модули курса</h2><div class="grid modules">${moduleCards()}</div></section>`; scrollTop(); }
      function showModules() { setNav("modules"); app.innerHTML = `<section class="section"><h1>Модули курса</h1><p>Откройте модуль, выберите урок и переходите к тренажерам.</p><div class="grid modules">${moduleCards()}</div></section>`; scrollTop(); }
      function moduleCards() { return course.map((module, i) => `<article class="card"><h3>${i}. ${module.title}</h3><p>${module.lessons.length} уроков • ${module.time} • проект: ${module.project}</p><span class="pill">${module.level}</span><div class="bar" style="--value:${moduleProgress(i)}%"><div class="fill"></div></div><p class="muted">${moduleProgress(i)}% завершено</p><button class="button" onclick="openModule(${i})">Открыть модуль</button></article>`).join(""); }
      function openModule(index) { currentModule = index; setNav("modules"); const module = course[index]; app.innerHTML = `<section class="section"><button class="ghost" onclick="showModules()">Назад к модулям</button><h1>${index}. ${module.title}</h1><p>${module.lessons.length} уроков • ${module.time} • проект: ${module.project}</p><span class="pill">${module.level}</span>${module.safe ? `<p class="notice">${module.safe}</p>` : ""}<div class="grid two section"><div class="card"><h2>Уроки</h2>${module.lessons.map((lesson, l) => `<div class="row"><div><strong>${l + 1}. ${lesson}</strong><p class="muted">${progress.lessons.includes(lessonId(index, l)) ? "Завершен" : "Не начат"}</p></div><button class="button" onclick="openLesson(${index}, ${l})">Начать</button></div>`).join("")}</div><div class="card"><h2>Практический проект</h2><p>${module.project}</p><ul><li>Сформулировать цель и входные данные.</li><li>Разделить код на parsing, validation, report.</li><li>Подготовить безопасные тестовые примеры.</li><li>Сохранить результат в JSON-отчет.</li></ul></div></div></section>`; scrollTop(); }
      function openLesson(m, l) { currentModule = m; currentLesson = l; selectedAnswer = ""; const module = course[m], title = module.lessons[l], id = lessonId(m, l); setNav("modules"); app.innerHTML = `<section class="section"><button class="ghost" onclick="openModule(${m})">Назад к модулю</button><p class="muted">Модуль ${m} • урок ${l + 1} из ${module.lessons.length}</p><h1>${title}</h1><div class="grid two"><article class="card"><h2>Теория</h2><p>В этом уроке тема рассматривается как часть рабочего процесса специалиста по кибербезопасности. Цель не просто вспомнить синтаксис Python, а научиться превращать его в надежный инструмент: валидатор, парсер, анализатор или API-клиент.</p><ul><li>Разделяйте чтение данных, проверку и отчет.</li><li>Обрабатывайте некорректный ввод явно.</li><li>Используйте только разрешенные цели и учебные данные.</li><li>Пишите результат так, чтобы его можно было передать в аудит.</li></ul></article><article class="card"><h2>Контекст ИБ</h2><p>Тема применяется в проекте <strong>${module.project}</strong>. Практическая цель: собрать маленький компонент defensive tooling, который можно расширять.</p>${module.safe ? `<p class="notice">${module.safe}</p>` : ""}</article></div><article class="card section"><h2>Квиз</h2><p>Что важнее всего для безопасного учебного инструмента?</p>${["Валидация входных данных и явная обработка ошибок", "Хранение секретов в коде", "Сканирование чужих сетей без разрешения", "Игнорирование логов"].map(answer => `<button class="answer" onclick="selectAnswer(this, '${answer}')">${answer}</button>`).join("")}<p id="quizResult" class="result"></p><button class="button" onclick="checkQuiz('${id}')">Проверить квиз</button></article><article class="card section"><h2>Тренажер кода</h2><p>Допишите функцию нормализации finding для JSON-отчета.</p><textarea id="code">def normalize_finding(raw_value: str) -> dict:\n    # TODO: strip, lower, validate\n    return {\n        "value": raw_value,\n        "valid": False,\n        "source": "lab"\n    }</textarea><p id="codeResult" class="result"></p><button class="button" onclick="checkCode('${id}')">Проверить решение</button><button class="ghost" onclick="showSolution()">Показать эталон</button><pre id="solution" class="hidden">def normalize_finding(raw_value: str) -> dict:\n    value = raw_value.strip().lower()\n    return {"value": value, "valid": bool(value), "source": "lab"}</pre></article><div class="section row"><button class="button" onclick="completeLesson('${id}')">${progress.lessons.includes(id) ? "Урок завершен" : "Отметить урок завершенным"}</button><div>${l > 0 ? `<button class="ghost" onclick="openLesson(${m}, ${l - 1})">Предыдущий</button>` : ""}${l < module.lessons.length - 1 ? `<button class="button" onclick="openLesson(${m}, ${l + 1})">Следующий урок</button>` : `<button class="button" onclick="openModule(${m})">К модулю</button>`}</div></div></section>`; scrollTop(); }
      function selectAnswer(button, answer) { selectedAnswer = answer; document.querySelectorAll(".answer").forEach(item => item.classList.remove("selected")); button.classList.add("selected"); }
      function checkQuiz(id) { const r = document.getElementById("quizResult"); if (selectedAnswer === "Валидация входных данных и явная обработка ошибок") { addUnique("quiz", id); r.className = "result success"; r.textContent = "Верно. Надежный defensive tool должен быть предсказуемым и объяснимым."; } else { r.className = "result warn"; r.textContent = "Попробуйте еще раз: подумайте о безопасном вводе, ошибках и аудите."; } }
      function checkCode(id) { const code = document.getElementById("code").value.toLowerCase(); const ok = ["strip", "lower", "return", "valid"].filter(word => code.includes(word)).length >= 3; const r = document.getElementById("codeResult"); if (ok) { addUnique("code", id); r.className = "result success"; r.textContent = "Принято. Решение похоже на рабочую MVP-нормализацию."; } else { r.className = "result warn"; r.textContent = "Добавьте strip/lower, return и явный признак valid."; } }
      function showSolution() { document.getElementById("solution").classList.toggle("hidden"); }
      function completeLesson(id) { addUnique("lessons", id); openLesson(currentModule, currentLesson); }
      function showProjects() { setNav("projects"); app.innerHTML = `<section class="section"><h1>Практические проекты</h1><p>Отмечайте проекты по мере выполнения. Все статусы сохраняются в localStorage.</p><div class="grid projects">${projects.map((project, index) => `<article class="card"><h3>${project}</h3><p>Практический проект для портфолио security tooling: входные данные, проверка, JSON-отчет и README.</p><span class="pill">Python</span><span class="pill">Defensive Security</span><p class="muted">${progress.projects.includes(index) ? "Завершен" : "Не завершен"}</p><button class="button" onclick="toggleProject(${index})">${progress.projects.includes(index) ? "Снять отметку" : "Отметить проект"}</button></article>`).join("")}</div></section>`; scrollTop(); }
      function toggleProject(index) { if (progress.projects.includes(index)) progress.projects = progress.projects.filter(item => item !== index); else progress.projects.push(index); save(); showProjects(); }
      function showFinal() { setNav("final"); app.innerHTML = `<section class="hero"><span class="eyebrow">Final Capstone</span><h1>Security Inspector</h1><p>Финальная платформа для безопасных проверок разрешенных web-ресурсов и инфраструктурных артефактов.</p></section><section class="grid two section"><article class="card"><h2>Функции</h2><ul><li>SSL check и certificate analysis</li><li>HTTP Security Headers и DNS check</li><li>Open ports только для разрешенных целей</li><li>IOC check и log analysis</li><li>HTML/PDF report generation</li></ul></article><article class="card"><h2>План реализации</h2><ul><li>MVP: локальные проверки и JSON-отчет</li><li>Backend: FastAPI, Pydantic, PostgreSQL</li><li>Frontend: dashboard, история, фильтры</li><li>DevSecOps: Docker, GitHub Actions, Bandit, Semgrep</li></ul></article></section>`; scrollTop(); }
      function findRecommended() { for (let m = 0; m < course.length; m++) for (let l = 0; l < course[m].lessons.length; l++) if (!progress.lessons.includes(lessonId(m, l))) return { m, l }; return { m: 0, l: 0 }; }
      showDashboard();
    </script>
  </body>
</html>
